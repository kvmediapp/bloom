# Bloom server for Unraid (or any Docker host).
#
#   docker compose up -d --build
#
# Follows the TRaSH Guides layout: one /data share on the host, mounted at
# /data in every container, with movies and shows under /data/media.
#   /mnt/user/data/media/movies, /mnt/user/data/media/shows
# Mounted read-only, so Bloom can never change your library. Plex, Radarr and
# Sonarr keep working alongside it. App settings live in appdata, as /config.
services:
  bloom:
    build: ./server
    container_name: bloom
    restart: unless-stopped
    ports:
      - "8484:8484"
    environment:
      # Optional but recommended: clients must send "Authorization: Bearer <token>".
      BLOOM_TOKEN: ""
      BLOOM_MEDIA_DIR: /data/media
      BLOOM_CACHE_DIR: /config
      # Subfolders of /data/media to scan (comma separated). Exclusive folders are left out on purpose.
      BLOOM_LIBRARIES: movies,shows
      TZ: America/New_York
    user: "99:100"   # Unraid nobody:users, same as the TRaSH PUID/PGID
    volumes:
      - /mnt/user/data:/data:ro               # TRaSH root share (media lives in /data/media)
      - /mnt/user/appdata/bloom:/config       # scan results and remuxed segments
    # Phase 2 adds Quick Sync transcoding. Uncomment then:
    # devices:
    #   - /dev/dri:/dev/dri
